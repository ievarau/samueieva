<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samuele &amp; Ieva — Our Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..600;1,300..600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #b24a3b;
    --primary-light: #f0d3cc;
    --bg-light: #faf8f4;
    --text-dark: #2e2a27;
    --text-muted: #6b635c;
    --border-color: #ede4d9;
    --font-serif: 'Playfair Display', Georgia, serif;
    --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--bg-light);
    font-family: var(--font-sans);
    color: var(--text-dark);
    padding: 1.5rem;
  }
  .lock-card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 3rem 2.25rem;
    text-align: center;
    box-shadow: 0 16px 40px rgba(178, 74, 59, 0.08);
  }
  .lock-icon { font-size: 1.8rem; margin-bottom: 1rem; color: var(--primary-light); }
  .lock-card h1 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 1.9rem;
    margin: 0 0 0.5rem;
  }
  .lock-card p.sub {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0 0 2rem;
  }
  .lock-card input[type="password"] {
    width: 100%;
    padding: 0.9rem 1rem;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 1rem;
    font-family: var(--font-sans);
    outline: none;
    margin-bottom: 1.25rem;
  }
  .lock-card input[type="password"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(178, 74, 59, 0.1);
  }
  .lock-card button {
    width: 100%;
    padding: 0.9rem 1rem;
    border: none;
    border-radius: 6px;
    background-color: var(--primary);
    color: #fff;
    font-family: var(--font-sans);
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  .lock-card button:hover { background-color: #8a3124; }
  .lock-card button:disabled { opacity: 0.6; cursor: default; }
  .lock-error {
    display: none;
    color: var(--primary);
    font-size: 0.85rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>
  <div class="lock-card">
    <div class="lock-icon">&#10047;</div>
    <h1>Samuele &amp; Ieva</h1>
    <p class="sub">Enter the password from your invitation to view our wedding details.</p>
    <form id="unlockForm" autocomplete="off">
      <input type="password" id="sitePassword" placeholder="Password" required autofocus>
      <button type="submit" id="unlockBtn">View Invitation</button>
      <p class="lock-error" id="lockError">Incorrect password. Please try again.</p>
    </form>
  </div>

  var ITERATIONS = 250000;

  function b64ToBuf(b64) {
    var bin = atob(b64);
    var buf = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf;
  }

  function decryptSite(password) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (keyMaterial) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBuf(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(IV) }, key, b64ToBuf(DATA));
      })
      .then(function (plainBuf) {
        return new TextDecoder().decode(plainBuf);
      });
  }

  var cached = sessionStorage.getItem('weddingSiteContent');
  if (cached) {
    document.open();
    document.write(cached);
    document.close();
  }

  var form = document.getElementById('unlockForm');
  var errorEl = document.getElementById('lockError');
  var btn = document.getElementById('unlockBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var password = document.getElementById('sitePassword').value;
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Checking...';
    decryptSite(password).then(function (html) {
      sessionStorage.setItem('weddingSiteContent', html);
      document.open();
      document.write(html);
      document.close();
    }).catch(function () {
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'View Invitation';
    });
  });
